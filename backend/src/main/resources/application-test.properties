# Use an in-memory H2 database for tests.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configure Hibernate for H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Use a local mail host during tests.
spring.mail.host=localhost

# Provide fixed placeholder credentials so tests do not depend on environment variables.
GMAIL_USERNAME=mock-email@gmail.com
GMAIL_APP_PASSWORD=mockpassword
JWT_SECRET=mockjwtsecretkeyformocktokengenerationthatislongenough1234
CLOUDINARY_CLOUD_NAME=mockcloudname
CLOUDINARY_API_KEY=mockapikey
CLOUDINARY_API_SECRET=mockapisecret
