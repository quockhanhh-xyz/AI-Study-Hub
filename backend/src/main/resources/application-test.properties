# Use an in-memory H2 database for tests.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configure Hibernate for H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Use a local mail host during tests.
spring.mail.host=localhost

# Provide fixed placeholder credentials so tests do not depend on environment variables.
GMAIL_USERNAME=mock-email@gmail.com
GMAIL_APP_PASSWORD=mockpassword
JWT_SECRET=mockjwtsecretkeyformocktokengenerationthatislongenough1234
CLOUDINARY_CLOUD_NAME=mockcloudname
CLOUDINARY_API_KEY=mockapikey
CLOUDINARY_API_SECRET=mockapisecret

# -------------------------------------------------------
# Step 13B: VNPay disabled in tests (no real Sandbox calls),
# Mock provider enabled so mock payment tests keep working.
# -------------------------------------------------------
vnpay.enabled=false
vnpay.tmn-code=mock-tmn-code
vnpay.hash-secret=mock-hash-secret-for-tests-only
vnpay.payment-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payments/vnpay/return
vnpay.ipn-url=http://localhost:8080/api/payments/vnpay/ipn

payment.mock-enabled=true

frontend.payment-result-url=http://localhost:5500/payment-result.html