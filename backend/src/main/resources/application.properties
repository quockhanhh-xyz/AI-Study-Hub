# Ket noi MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Admin Account Seeder
admin.seed.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin Seed
admin.seed.enabled=${ADMIN_SEED_ENABLED:false}
admin.seed.email=${ADMIN_SEED_EMAIL:}
admin.seed.password=${ADMIN_SEED_PASSWORD:}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

cloudinary.enabled=${CLOUDINARY_ENABLED:false}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart upload limit
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# -------------------------------------------------------
# AI Provider Configuration (Step 10)
# -------------------------------------------------------
# ai.provider=mock   -> Use mock responses, no API key needed (default for local dev)
# ai.provider=gemini -> Use Google Gemini API (requires GEMINI_API_KEY env var)
ai.provider=${AI_PROVIDER:mock}

# Gemini API credentials and model selection
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.free-model=${GEMINI_MODEL_FREE:gemini-2.5-flash-lite}
ai.gemini.premium-model=${GEMINI_MODEL_PREMIUM:gemini-2.5-flash}
ai.gemini.ultra-model=${GEMINI_MODEL_ULTRA:gemini-2.5-flash}
ai.gemini.fallback-model=${GEMINI_MODEL_FALLBACK:gemini-2.5-pro}


# AI generation temperature (lower = more factual, less creative)
ai.temperature=${AI_TEMPERATURE:0.2}

# HTTP timeouts for AI provider calls (milliseconds)
ai.gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:5000}
ai.gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:30000}

# -------------------------------------------------------
# VNPay Sandbox Payment Configuration (Step 13B)
# -------------------------------------------------------
# App MUST start successfully even when VNPay keys are blank (enabled=false default).
vnpay.enabled=${VNPAY_ENABLED:false}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.ipn-url=${VNPAY_IPN_URL:}

# Mock payment provider — can be disabled independently in production.
payment.mock-enabled=${PAYMENT_MOCK_ENABLED:true}

# Where VNPay Return redirects the user's browser back to (FE payment-result page).
frontend.payment-result-url=${FRONTEND_PAYMENT_RESULT_URL:}

# Base URL of the frontend app, used to build group invite join URLs.
frontend.base-url=${FRONTEND_BASE_URL:}