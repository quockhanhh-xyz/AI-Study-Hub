# Ket noi MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

cloudinary.enabled=${CLOUDINARY_ENABLED:false}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# -------------------------------------------------------
# AI Provider Configuration (Step 10)
# -------------------------------------------------------
# ai.provider=mock   -> Use mock responses, no API key needed (default for local dev)
# ai.provider=gemini -> Use Google Gemini API (requires GEMINI_API_KEY env var)
ai.provider=${AI_PROVIDER:mock}

# Gemini API credentials and model selection
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.free-model=${GEMINI_MODEL_FREE:gemini-2.5-flash-lite}
ai.gemini.premium-model=${GEMINI_MODEL_PREMIUM:gemini-2.5-flash}
ai.gemini.fallback-model=${GEMINI_MODEL_FALLBACK:gemini-2.5-pro}

# Tier-based limits — FREE
ai.free.daily-question-limit=${AI_FREE_DAILY_LIMIT:5}
ai.free.max-question-chars=${AI_FREE_MAX_QUESTION_CHARS:500}
ai.free.max-context-chunks=${AI_FREE_MAX_CONTEXT_CHUNKS:3}
ai.free.max-output-tokens=${AI_FREE_MAX_OUTPUT_TOKENS:500}

# Tier-based limits — PREMIUM
ai.premium.daily-question-limit=${AI_PREMIUM_DAILY_LIMIT:50}
ai.premium.max-question-chars=${AI_PREMIUM_MAX_QUESTION_CHARS:2000}
ai.premium.max-context-chunks=${AI_PREMIUM_MAX_CONTEXT_CHUNKS:8}
ai.premium.max-output-tokens=${AI_PREMIUM_MAX_OUTPUT_TOKENS:1500}

# AI generation temperature (lower = more factual, less creative)
ai.temperature=${AI_TEMPERATURE:0.2}

# HTTP timeouts for AI provider calls (milliseconds)
ai.gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:5000}
ai.gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:30000}

