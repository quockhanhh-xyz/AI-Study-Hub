# Database Configuration (References to environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret (Must be a secure Base64-encoded string of at least 256 bits)
# Example: generate a Base64-encoded 256-bit secret and set it through JWT_SECRET.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary Configuration (Optional - set enabled to true if using Cloudinary)
cloudinary.enabled=${CLOUDINARY_ENABLED:false}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart upload limit
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB

# AI Configuration
ai.provider=${AI_PROVIDER:mock}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.free-model=${GEMINI_MODEL_FREE:gemini-2.5-flash-lite}
ai.gemini.premium-model=${GEMINI_MODEL_PREMIUM:gemini-2.5-flash}
ai.gemini.ultra-model=${GEMINI_MODEL_ULTRA:gemini-2.5-flash}

# Cookie Security Configuration (Used by AuthCookieConstants)
# COOKIE_SECURE: Set this environment variable to "true" for HTTPS production environment.
# By default, it resolves to "false" if not defined, allowing HttpOnly auth cookies over plain HTTP (essential for local LAN testing).

# -------------------------------------------------------
# VNPay Sandbox Payment Configuration (Step 13B)
# -------------------------------------------------------
# App MUST start successfully even when VNPay keys are blank (enabled=false default).
# VNPAY_ENABLED: set to "true" only once you have real Sandbox credentials below.
vnpay.enabled=${VNPAY_ENABLED:false}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
# VNPAY_RETURN_URL / VNPAY_IPN_URL must be reachable from VNPay's servers.
# IPN requires a public HTTPS URL — localhost/LAN IP will NOT work; use a tunnel (e.g. ngrok) for local dev.
vnpay.return-url=${VNPAY_RETURN_URL:}
vnpay.ipn-url=${VNPAY_IPN_URL:}

# Mock payment provider — keep enabled for local/demo; can be disabled independently in production.
payment.mock-enabled=${PAYMENT_MOCK_ENABLED:true}

# Where VNPay Return redirects the user's browser back to (FE payment-result page).
frontend.payment-result-url=${FRONTEND_PAYMENT_RESULT_URL:}

# Base URL of the frontend app — used to build the join link in group invite emails.
# Change to your deployed domain in production (e.g. https://your-domain.com).
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5500}