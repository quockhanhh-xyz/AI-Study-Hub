# Database Configuration Example
spring.datasource.url=your_db_url_here
spring.datasource.username=your_db_username_here
spring.datasource.password=your_db_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret Example (Min 256-bit key)
jwt.secret=your_jwt_secret_key_here

# Gmail SMTP Configuration Example
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_gmail_username_here
spring.mail.password=your_gmail_app_password_here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary Configuration Example
cloudinary.enabled=false
cloudinary.cloud-name=your_cloudinary_cloud_name_here
cloudinary.api-key=your_cloudinary_api_key_here
cloudinary.api-secret=your_cloudinary_api_secret_here

# Multipart upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
