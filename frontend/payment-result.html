<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Result - AI Study Hub</title>
    <meta name="description" content="Check the result of your payment." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
<style>
.theme-toggle-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border-radius: 50%;
  transition: background 0.2s, color 0.2s;
  margin-right: 16px;
}
.theme-toggle-btn:hover {
  background: var(--border);
  color: var(--primary);
}
.theme-toggle-btn .icon-sun {
  display: none;
}
[data-theme="dark"] .theme-toggle-btn .icon-moon {
  display: none;
}
[data-theme="dark"] .theme-toggle-btn .icon-sun {
  display: block;
}
</style>
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <h2 class="logo">AI Study Hub</h2>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <section class="page-header dashboard-header">
                <div class="dashboard-header-content">
                    <div>
                        <h1>Payment Result</h1>
                        <p class="dashboard-subtitle">Checking the status of your payment.</p>
                    </div>
                </div>
            </section>

            <section class="card" style="max-width: 560px; margin: 0 auto; text-align: center;">

                <div id="resultLoading" class="empty-state dashboard-loader" style="display: none;">
                    <span id="resultLoadingText">Checking payment status...</span>
                </div>

                <div id="resultInvalid" class="status-box status-error" style="display: none;">
                    Something went wrong verifying your payment. Please check your payment history.
                </div>

                <div id="resultSessionExpired" style="display: none;">
                    <p class="helper-text error">Your session has expired. Please log in again to continue checking this payment.</p>
                    <a id="resultLoginLink" href="#" class="btn btn-primary btn-auto">Log in again</a>
                </div>

                <div id="resultStatus" style="display: none;">
                    <div id="resultStatusBadge" class="payment-result-badge" style="margin-bottom: 16px;"></div>
                    <p id="resultStatusMessage" style="color: var(--text-muted); margin-bottom: 20px;"></p>

                    <div id="resultPlanInfo" style="color: var(--text-main); font-weight: 600; margin-bottom: 24px;"></div>

                    <div id="resultActions" style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;"></div>
                </div>

            </section>

            <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>

    <script src="js/navigation.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auth.js"></script>

    <script src="js/payment-api.js"></script>
    <script src="js/payment-result.js"></script>
<script src="js/notification-api.js"></script>
    <script src="js/notification.js"></script>
</body>

</html>
