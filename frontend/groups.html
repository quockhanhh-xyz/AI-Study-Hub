<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Groups - AI Study Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <h2 class="logo">AI Study Hub</h2>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">

            <section class="page-header" style="display: flex; justify-content: space-between; align-items: center; max-width: none; margin-top: 8px; margin-bottom: 24px;">
                <div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start;">
                    <p style="margin: 0; color: var(--muted); font-size: 14px;">Click a group to view members and shared documents.</p>
                    <h1 style="margin: 4px 0 0 0; font-size: 26px; font-weight: 800; color: var(--text);">My Study Groups</h1>
                </div>
                <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                    <button type="button" id="joinGroupBtn" class="btn btn-secondary" style="width: auto !important; padding: 10px 16px;">
                        Join Group
                    </button>
                    <button type="button" id="createGroupBtn" class="btn btn-primary upload-link-btn" style="display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; width: auto !important;">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14" id="Add-1--Streamline-Core" height="14" width="14" aria-hidden="true" focusable="false">
                          <desc>Add 1 Streamline Icon: https://streamlinehq.com</desc>
                          <g id="add-1--expand-cross-buttons-button-more-remove-plus-add-+-mathematics-math">
                            <path id="Vector" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M7 0.5v13" stroke-width="1"></path>
                            <path id="Vector_2" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M0.5 6.95996h13" stroke-width="1"></path>
                          </g>
                        </svg>
                        New Group
                    </button>
                </div>
            </section>

            <div id="groupListView" class="dashboard-panel">
                <div id="groupLoader" class="document-state" style="display: none; justify-content: center; padding: 24px;">
                    <span>Loading groups...</span>
                </div>

                <p id="groupError" class="helper-text error" role="alert" style="display: none;"></p>

                <div id="groupGrid" class="folder-grid" style="display: none;"></div>

                <div id="groupEmpty" class="empty-state" style="display: none;">
                    <div class="empty-title">No study groups yet</div>
                    <p>Create your first group or join one using an invite code. Use the buttons above.</p>
                </div>
            </div>

        </main>
    </div>

    <div class="modal-overlay" id="createModal" role="dialog" aria-modal="true" aria-labelledby="createModalTitle">
        <div class="modal-box">
            <h3 id="createModalTitle">New Study Group</h3>
            <div class="form-group">
                <label for="createGroupName">Group name <span class="label-required">*</span></label>
                <input type="text" id="createGroupName" placeholder="E.g: Calculus Study Group" autocomplete="off" />
            </div>
            <div class="form-group">
                <label for="createGroupDescription">Description</label>
                <input type="text" id="createGroupDescription" placeholder="Optional description" autocomplete="off" />
            </div>
            <p id="createError" class="modal-error" role="alert" aria-live="polite"></p>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="createCancelBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="createConfirmBtn">Create</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="joinModal" role="dialog" aria-modal="true" aria-labelledby="joinModalTitle">
        <div class="modal-box">
            <h3 id="joinModalTitle">Join Study Group</h3>
            <div class="form-group">
                <label for="joinInviteCode">Invite code <span class="label-required">*</span></label>
                <input type="text" id="joinInviteCode" placeholder="E.g: ABCD1234" autocomplete="off" />
            </div>
            <p id="joinError" class="modal-error" role="alert" aria-live="polite"></p>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="joinCancelBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="joinConfirmBtn">Join</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/group-api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/groups.js"></script>
</body>

</html>
