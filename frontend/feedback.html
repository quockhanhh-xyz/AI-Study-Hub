<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Send Feedback - AI Study Hub</title>
    <meta name="description" content="Rate your experience with AI Study Hub and share your feedback with us." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css?v=15" />
    <style>
        .feedback-grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 24px;
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 992px) {
            .feedback-grid {
                grid-template-columns: 1fr;
            }
        }

        .feedback-card {
            background: var(--card-bg, #ffffff);
            border-radius: 16px;
            border: 1px solid var(--border, #e2e8f0);
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            height: fit-content;
        }

        .feedback-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-color, #0f172a);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Star Rating styles */
        .star-rating-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .stars-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .star-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: #cbd5e1;
            transition: transform 0.2s, color 0.2s;
        }

        .star-btn:hover {
            transform: scale(1.15);
        }

        .star-btn.active, .star-btn.hover {
            color: #fbbf24; /* Amber star color */
        }

        .star-btn svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .rating-description {
            font-size: 0.875rem;
            color: var(--text-muted, #64748b);
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-color, #0f172a);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border, #e2e8f0);
            background: var(--bg-color, #f8fafc);
            color: var(--text-color, #0f172a);
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary, #3b82f6);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Status Badge styles */
        .status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 9999px;
            text-transform: uppercase;
        }

        .status-new { background: #eff6ff; color: #1e40af; }
        .status-in_review { background: #fef3c7; color: #92400e; }
        .status-responded { background: #f0fdf4; color: #166534; }
        .status-resolved { background: #e0f2fe; color: #0369a1; }
        .status-archived { background: #f1f5f9; color: #475569; }

        /* Timeline / Chat styles */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 480px;
            background: var(--bg-color, #f8fafc);
            border-radius: 12px;
            border: 1px solid var(--border, #e2e8f0);
            overflow: hidden;
            margin-top: 16px;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            line-height: 1.5;
            position: relative;
        }

        .chat-bubble.user {
            background: var(--primary, #3b82f6);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-bubble.admin {
            background: var(--card-bg, #ffffff);
            color: var(--text-color, #0f172a);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border, #e2e8f0);
        }

        .chat-meta {
            font-size: 0.7rem;
            margin-top: 4px;
            opacity: 0.8;
            text-align: right;
        }

        .chat-bubble.admin .chat-meta {
            color: var(--text-muted, #64748b);
        }

        .chat-input-area {
            padding: 12px;
            background: var(--card-bg, #ffffff);
            border-top: 1px solid var(--border, #e2e8f0);
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border, #e2e8f0);
            outline: none;
            background: var(--bg-color, #f8fafc);
            color: var(--text-color, #0f172a);
            font-size: 0.875rem;
        }

        .chat-input-area button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background: var(--primary, #3b82f6);
            color: #ffffff;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-input-area button:hover {
            background: #2563eb;
        }

        /* Helpers */
        .btn-danger-outline {
            background: transparent;
            border: 1px solid var(--danger, #ef4444);
            color: var(--danger, #ef4444);
        }

        .btn-danger-outline:hover {
            background: var(--danger, #ef4444);
            color: #ffffff;
        }

        .no-feedback-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            color: var(--text-muted, #64748b);
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <h2 class="logo">AI Study Hub</h2>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <section class="page-header dashboard-header">
                <div class="dashboard-header-content">
                    <div class="header-title-section">
                        <h1>Send Feedback</h1>
                        <p class="dashboard-subtitle">We would love to hear your thoughts and suggestions on AI Study Hub.</p>
                    </div>
                    <div class="dashboard-search-and-profile">
                        <div id="globalHeaderWidgets" class="global-header-widgets"></div>
                    </div>
                </div>
            </section>

            <div class="feedback-grid">
                <!-- Feedback Submission Form -->
                <div class="feedback-card">
                    <h2 class="feedback-title" id="formCardTitle">
                        <span>Submit System Review</span>
                        <span id="reviewStatusBadge" class="status-badge" style="display: none;">NEW</span>
                    </h2>

                    <form id="feedbackForm">
                        <!-- Star Rating -->
                        <div class="star-rating-container">
                            <label>Rate your experience *</label>
                            <div class="stars-row">
                                <button type="button" class="star-btn" data-value="1">
                                    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                                </button>
                                <button type="button" class="star-btn" data-value="2">
                                    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                                </button>
                                <button type="button" class="star-btn" data-value="3">
                                    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                                </button>
                                <button type="button" class="star-btn" data-value="4">
                                    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                                </button>
                                <button type="button" class="star-btn" data-value="5">
                                    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                                </button>
                                <span class="rating-description" id="ratingText">Select rating</span>
                            </div>
                        </div>

                        <!-- Category -->
                        <div class="form-group">
                            <label for="feedbackCategory">Feedback Category *</label>
                            <select id="feedbackCategory" class="form-control" required>
                                <option value="" disabled selected>Select feedback category</option>
                                <option value="General Experience">General Experience</option>
                                <option value="Bug Report">Bug Report</option>
                                <option value="Feature Request">Feature Request</option>
                                <option value="Performance">Performance</option>
                                <option value="AI Quality">AI Quality</option>
                                <option value="Payment">Payment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <!-- Title -->
                        <div class="form-group">
                            <label for="feedbackTitle">Title *</label>
                            <input type="text" id="feedbackTitle" class="form-control" placeholder="Short summary of your feedback (max 150 characters)" maxlength="150" required />
                        </div>

                        <!-- Content -->
                        <div class="form-group">
                            <label for="feedbackContent">Review Comments *</label>
                            <textarea id="feedbackContent" class="form-control" placeholder="Tell us more about your experience (10 to 2000 characters)" rows="6" minlength="10" maxlength="2000" required></textarea>
                        </div>

                        <!-- Actions -->
                        <div style="display: flex; gap: 12px; margin-top: 24px;">
                            <button type="submit" class="btn btn-primary" style="flex: 1;" id="btnSubmitFeedback">Submit Review</button>
                            <button type="button" class="btn btn-danger-outline" style="display: none;" id="btnDeleteFeedback">Delete Review</button>
                        </div>
                    </form>
                </div>

                <!-- Conversation Timeline -->
                <div class="feedback-card" style="display: flex; flex-direction: column;">
                    <h2 class="feedback-title">
                        <span>Admin Conversations</span>
                    </h2>
                    <div id="noConversationState" class="no-feedback-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" height="48" width="48" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 12px; opacity: 0.6;">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" />
                        </svg>
                        <p>Submit a review to start a conversation with the support team.</p>
                    </div>

                    <div id="conversationTimeline" class="chat-container" style="display: none;">
                        <div class="chat-messages" id="chatMessages">
                            <!-- Populated dynamically -->
                        </div>
                        <div class="chat-input-area">
                            <input type="text" id="chatInput" placeholder="Type a response to support..." maxlength="5000" />
                            <button type="button" id="btnSendReply">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script loading -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/feedback-api.js"></script>
    <script src="js/feedback.js"></script>
    <script src="js/notification-api.js"></script>
    <script src="js/notification.js"></script>
</body>

</html>
