<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Usage Monitoring - AI Study Hub Admin</title>
    <!-- Include global styles first, then admin styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Mock Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <h2>Admin Console</h2>
            <nav>
                <a href="admin-dashboard.html">Dashboard</a>
                <a href="admin-users.html">Users</a>
                <a href="admin-documents.html">Public Documents</a>
                <a href="admin-payments.html">Payments</a>
                <a href="admin-ai-usage.html" class="active">AI Usage</a>
                <a href="admin-subjects.html">Subjects</a>
                <a href="index.html">Back to App</a>
            </nav>
        </aside>

        <main class="admin-content">
            <div class="admin-header">
                <h1>AI Usage Monitoring</h1>
                <button id="exportBtn" class="btn btn-primary">Export Excel</button>
            </div>

            <!-- Filters -->
            <div class="filter-section form-group" style="display: flex; gap: 10px; align-items: center; margin-bottom: 20px;">
                <input type="text" id="searchInput" placeholder="Search by User Email..." style="flex: 1;">
                <select id="tierFilter">
                    <option value="">All Tiers</option>
                    <option value="FREE">FREE</option>
                    <option value="PREMIUM">PREMIUM</option>
                    <option value="ULTRA">ULTRA</option>
                </select>
                <!-- Not adding feature filter as dropdown if we show all features in columns, but per instructions "Filter tier/feature/date range", so maybe filter by specific usage -->
                <input type="date" id="startDateFilter" title="Start Date">
                <input type="date" id="endDateFilter" title="End Date">
                <button id="filterBtn" class="btn btn-secondary">Filter</button>
            </div>

            <!-- Table -->
            <div class="admin-table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>User Email</th>
                            <th>Tier</th>
                            <th>AI Q&A</th>
                            <th>Summary</th>
                            <th>Flashcard</th>
                            <th>Quiz</th>
                            <th>Total</th>
                            <th>Last Used At</th>
                        </tr>
                    </thead>
                    <tbody id="usageTableBody">
                        <tr><td colspan="8" style="text-align: center;">Loading...</td></tr>
                    </tbody>
                </table>
                <div id="pagination" class="pagination">
                    <!-- Pagination buttons -->
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/admin-ai-usage-api.js"></script>
    <script src="js/admin-ai-usage.js"></script>
</body>
</html>
