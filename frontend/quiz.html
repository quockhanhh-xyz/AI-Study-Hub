<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz - AI Study Hub</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h2 class="logo">AI Study Hub</h2>
      <nav class="sidebar-nav"></nav>
    </aside>

    <main class="main-content">
      <section class="page-header">
        <div>
          <h1 id="quizSetTitle">Quiz</h1>
          <p class="dashboard-subtitle" id="quizSetMeta"></p>
        </div>
      </section>

      <div id="quizLoader" class="empty-state dashboard-loader">
        <span>Loading quiz...</span>
      </div>

      <div id="quizErrorState" class="status-box status-error" style="display:none;"></div>

      <section id="quizViewer" class="card quiz-viewer" style="display:none;">
        <div class="quiz-progress" id="quizProgress"></div>

        <h2 class="quiz-question-text" id="quizQuestionText"></h2>
        <span class="status-badge quiz-difficulty-badge" id="quizDifficultyBadge"></span>

        <div class="quiz-options-list" id="quizOptionsList"></div>

        <div class="quiz-feedback" id="quizFeedback" style="display:none;"></div>

        <div class="quiz-controls">
          <button type="button" class="btn btn-secondary" id="quizPrevBtn">← Previous</button>
          <button type="button" class="btn btn-secondary" id="quizNextBtn">Next →</button>
        </div>
      </section>

      <section id="quizSummary" class="card" style="display:none;">
        <h2>Quiz complete</h2>
        <p id="quizSummaryText"></p>
        <button type="button" class="btn btn-secondary" id="quizRetakeBtn">Review again</button>
      </section>

      <a href="#" class="back-link" id="quizBackLink">← Back to document</a>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ai-learning-api.js"></script>
  <script src="js/quiz.js"></script>
</body>

</html>
