<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - AI Study Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />

</head>

<body>
    <div class="auth-shell">
        <div class="auth-visual">
            <div class="auth-visual-overlay"></div>
            
            <div class="auth-illustration">
                <div class="ill-orbit"></div>
                <div class="ill-center" title="AI Study Hub">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z" />
                    </svg>
                </div>
                
                <div class="ill-orbit-ring">
                    <div class="ill-icon ill-doc" title="Document Preview">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                        </svg>
                    </div>
                    
                    <div class="ill-icon ill-ai" title="AI Q&A">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                        </svg>
                    </div>
                    
                    <div class="ill-icon ill-flashcard" title="Flashcard/Quiz">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                    </div>
                    
                    <div class="ill-icon ill-community" title="Community Library">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                    </div>
                </div>
            </div>
            
            <div class="auth-visual-content">
                <h2 class="auth-visual-title">AI Study Hub</h2>
                <p class="auth-visual-subtitle">Empower your learning journey with the ultimate AI assistant.</p>
            </div>
        </div>

        <main class="auth-container">
            <section class="card form-card">
                <div style="text-align: center; margin-bottom: 32px;">
                    <h2 style="font-size: 32px; font-weight: 800; color: #172033; margin-bottom: 8px; margin-top: 0;">Sign in</h2>
                    <p style="color: var(--text-muted); font-size: 15px; margin: 0;">Welcome back! Sign in to continue your learning journey.</p>
                </div>
                
                <p id="loginMessage" class="helper-text"></p>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input id="loginEmail" name="email" type="email" placeholder="Enter your email" required />
                    </div>

                    <div class="form-group password-group">
                        <label for="loginPassword">Password</label>
                        <div class="password-field">
                            <input id="loginPassword" name="password" type="password" placeholder="Enter your password"
                                required />
                            <button type="button" class="password-toggle-btn" data-target="loginPassword"
                                aria-label="Show password">
                                <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    height="18" width="18" aria-hidden="true" focusable="false">
                                    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M2.25 12S6 4.5 12 4.5s9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12Z">
                                    </path>
                                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"></circle>
                                </svg>
                                <svg class="icon-eye-off" style="display: none;" xmlns="http://www.w3.org/2000/svg"
                                    fill="none" viewBox="0 0 24 24" height="18" width="18" aria-hidden="true"
                                    focusable="false">
                                    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.5 6.7C4.2 8.2 2.25 12 2.25 12S6 19.5 12 19.5c1.85 0 3.47-.42 4.86-1.06M9.9 4.7A10.6 10.6 0 0 1 12 4.5c6 0 9.75 7.5 9.75 7.5a17.6 17.6 0 0 1-2.44 3.42">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
                        Sign in
                    </button>

                    <div style="text-align: center; margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
                        <div class="guest-access" style="padding-bottom: 16px; margin-bottom: 4px;">
                            <a href="community.html" class="btn btn-secondary" style="width: 100%; text-decoration: none; display: inline-flex; justify-content: center; align-items: center;">
                                Continue as guest
                            </a>
                            <p style="font-size: 12px; color: var(--text-muted); margin: 8px 0 0 0;">Browse Community Library without an account.</p>
                        </div>
                        <p style="font-size: 13px; color: var(--text-muted); margin: 0;">
                            New here? <a href="register.html" style="color: var(--text-main); font-weight: 600; text-decoration: underline;">Create an account</a>
                        </p>
                        <p style="font-size: 13px; color: var(--text-muted); margin: 0;">
                            Already registered but not verified? <a href="verify-otp.html" style="color: var(--text-main); font-weight: 600; text-decoration: underline; white-space: nowrap;">Verify OTP</a>
                        </p>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <!-- Canvas Confetti for celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>

<script src="js/notification-api.js"></script>
    <script src="js/notification.js"></script>
</body>

</html>
