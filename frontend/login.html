<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - AI Study Hub</title>

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="auth-shell">
        <main class="auth-container">
            <div class="auth-header">
                <h1 class="auth-title">AI Study Hub</h1>
                <p>Only accounts verified by email OTP can access the system.</p>
            </div>

            <section class="card form-card">
                <h2 class="auth-card-title">Login</h2>
                <p id="loginMessage" class="helper-text"></p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input id="loginEmail" name="email" type="email" placeholder="user@test.com" required />
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input id="loginPassword" name="password" type="password" placeholder="Enter your password"
                            required />
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Login
                    </button>

                    <p class="helper-text">
                        New user? <a href="register.html">Create an account</a>
                    </p>

                    <p class="helper-text">
                        Already registered but not verified?
                        <a href="verify-otp.html">Verify OTP</a>
                    </p>

                </form>
            </section>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
