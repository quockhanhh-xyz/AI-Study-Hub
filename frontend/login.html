<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - AI Study Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />

</head>

<body>
    <div class="auth-shell">
        <div class="auth-visual">
            <div class="auth-bubble auth-bubble-1"></div>
            <div class="auth-bubble auth-bubble-2"></div>
            <div class="auth-bubble auth-bubble-3"></div>
            <div class="auth-bubble auth-bubble-4"></div>
            
            <div class="auth-visual-content">
                <h2 class="auth-visual-title">AI Study Hub</h2>
                <p class="auth-visual-subtitle">Empower your learning journey with the ultimate AI assistant.</p>
            </div>
        </div>

        <main class="auth-container">
            <section class="card form-card">
                <div style="text-align: center; margin-bottom: 32px;">
                    <h2 style="font-size: 32px; font-weight: 800; color: #172033; margin-bottom: 8px; margin-top: 0;">Sign in</h2>
                    <p style="color: var(--text-muted); font-size: 15px; margin: 0;">Welcome back! Sign in to continue your learning journey.</p>
                </div>
                
                <p id="loginMessage" class="helper-text"></p>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input id="loginEmail" name="email" type="email" placeholder="Enter your email" required />
                    </div>

                    <div class="form-group password-group">
                        <label for="loginPassword">Password</label>
                        <div class="password-field">
                            <input id="loginPassword" name="password" type="password" placeholder="Enter your password"
                                required />
                            <button type="button" class="password-toggle-btn" data-target="loginPassword"
                                aria-label="Show password">
                                <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    height="18" width="18" aria-hidden="true" focusable="false">
                                    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M2.25 12S6 4.5 12 4.5s9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12Z">
                                    </path>
                                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"></circle>
                                </svg>
                                <svg class="icon-eye-off" style="display: none;" xmlns="http://www.w3.org/2000/svg"
                                    fill="none" viewBox="0 0 24 24" height="18" width="18" aria-hidden="true"
                                    focusable="false">
                                    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.5 6.7C4.2 8.2 2.25 12 2.25 12S6 19.5 12 19.5c1.85 0 3.47-.42 4.86-1.06M9.9 4.7A10.6 10.6 0 0 1 12 4.5c6 0 9.75 7.5 9.75 7.5a17.6 17.6 0 0 1-2.44 3.42">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
                        Sign in
                    </button>

                    <div style="text-align: center; margin-top: 24px;">
                        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
                            <a href="community.html" style="font-weight: 500; color: var(--text-default); text-decoration: underline;">Continue as guest to Community Library</a>
                        </p>
                        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
                            New user? <a href="register.html" style="color: var(--primary);">Create an account</a>
                        </p>
                        <p style="font-size: 13px; color: var(--text-muted); margin: 0;">
                            Already registered but not verified? <a href="verify-otp.html" style="color: var(--primary); white-space: nowrap;">Verify&nbsp;OTP</a>
                        </p>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <!-- Canvas Confetti for celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>

<script src="js/notification-api.js"></script>
    <script src="js/notification.js"></script>
</body>

</html>
