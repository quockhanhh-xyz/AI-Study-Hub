<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - AI Study Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />

</head>

<body>
    <div class="auth-shell">
        <div class="auth-visual">
            <div class="auth-bubble auth-bubble-1"></div>
            <div class="auth-bubble auth-bubble-2"></div>
            <div class="auth-bubble auth-bubble-3"></div>
            <div class="auth-bubble auth-bubble-4"></div>
            
            <div class="auth-visual-content">
                <h2 class="auth-visual-title">AI Study Hub</h2>
                <p class="auth-visual-subtitle">Empower your learning journey with the ultimate AI assistant.</p>
            </div>
        </div>

        <main class="auth-container">
            <section class="card form-card">
                <div style="text-align: center; margin-bottom: 32px;">
                    <h2 style="font-size: 32px; font-weight: 800; color: #172033; margin-bottom: 8px; margin-top: 0;">Sign in</h2>
                    <p style="color: var(--text-muted); font-size: 15px; margin: 0;">Welcome back! Sign in to continue your learning journey.</p>
                </div>
                
                <p id="loginMessage" class="helper-text"></p>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input id="loginEmail" name="email" type="email" placeholder="Enter your email" required />
                    </div>

                    <div class="form-group password-group">
                        <label for="loginPassword">Password</label>
                        <div class="password-input-wrapper">
                            <input id="loginPassword" name="password" type="password" placeholder="Enter your password" required />
                            <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility" title="Show/Hide Password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="eyeGradientClosed" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF7E00"/><stop offset="100%" stop-color="#FFC107"/></linearGradient></defs><path d="M11.83 9L15 12.16V12a3 3 0 0 0-3-3h-.17zm-4.3.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm14.47 2.2c-.34 1.15-1 2.19-1.8 3.03l-1.46-1.46c.55-.66 1.01-1.42 1.33-2.26-1.5-3.8-5.26-6.5-9.67-6.5-.94 0-1.85.12-2.72.35L5.78 3.2 4.37 4.61l15.01 15.02 1.41-1.41-2.79-2.79v-.01zM2.81 7.28C1.86 8.65 1.25 10.26 1 12c1.73 4.39 6 7.5 11 7.5 1.3 0 2.54-.2 3.71-.56l-1.63-1.63C13.41 17.75 12.72 17.9 12 17.9c-2.76 0-5-2.24-5-5 0-.72.15-1.41.41-2.08L4.22 7.63c-.5.42-.99.86-1.41 1.35v-.01z" fill="url(#eyeGradientClosed)"/></svg></button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
                        Sign in
                    </button>

                    <div style="text-align: center; margin-top: 24px;">
                        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">
                            New user? <a href="register.html" style="color: var(--primary);">Create an account</a>
                        </p>
                        <p style="font-size: 13px; color: var(--text-muted); margin: 0;">
                            Already registered but not verified? <a href="verify-otp.html" style="color: var(--primary); white-space: nowrap;">Verify&nbsp;OTP</a>
                        </p>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <!-- Canvas Confetti for celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>

</body>

</html>
