<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP - AI Study Hub</title>
    <link rel="stylesheet" href="css/style.css" />

</head>

<body>
    <div class="auth-shell">
        <main class="auth-container">
            <div class="auth-header">
                <h1 class="auth-title">AI Study Hub</h1>
                <p>OTP has been sent to <strong id="displayEmail"></strong></p>
            </div>
            <section class="card form-card">
                <h2 class="auth-card-title">Verify Your Email</h2>
                <p id="otpMessage" class="helper-text"></p>
                <form id="otpForm" novalidate>
                    <div class="form-group">
                        <label for="otp">Enter OTP Code</label>
                        <input type="text" id="otp" placeholder="6-digit code" maxlength="6" inputmode="numeric"
                            autocomplete="one-time-code" required />
                    </div>
                    <button type="submit" class="btn btn-primary" id="verifyBtn">Verify</button>
                    <button type="button" class="btn btn-secondary" id="resendBtn">
                        Resend OTP
                    </button>
                    <p class="helper-text">
                        <a href="register.html">← Back to Register</a>
                    </p>
                </form>
            </section>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
</body>

</html>
