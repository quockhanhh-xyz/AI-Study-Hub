<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP - AI Study Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />

</head>

<body>
    <div class="auth-shell">
        <main class="auth-container">
            <div class="auth-header">
                <h1 class="auth-title">AI Study Hub</h1>
                <p>OTP has been sent to <strong id="displayEmail"></strong></p>
            </div>
            <section class="card form-card">
                <h2 class="auth-card-title">Verify Your Email</h2>
                <p id="otpMessage" class="helper-text"></p>
                <form id="otpForm" novalidate>
                    <div class="form-group">
                        <label for="otp">Enter OTP Code</label>
                        <input type="text" id="otp" placeholder="6-digit code" maxlength="6" inputmode="numeric"
                            autocomplete="one-time-code" required />
                    </div>
                    <button type="submit" class="btn btn-primary" id="verifyBtn">Verify</button>
                    <button type="button" class="btn btn-secondary" id="resendBtn">
                        Resend OTP
                    </button>
                    <p class="helper-text">
                        <a href="register.html" style="display: inline-flex; align-items: center; gap: 4px;">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" id="Right-Angle-Arrow--Streamline-Guidance-Free" height="14" width="14" aria-hidden="true" focusable="false">
                              <desc>Right Angle Arrow Streamline Icon: https://streamlinehq.com</desc>
                              <path stroke="currentColor" d="M8 24c0 -0.741 -0.733 -1.85 -1.475 -2.78 -0.954 -1.2 -2.094 -2.247 -3.401 -3.046C2.144 17.575 0.956 17 0 17m0 0c0.956 0 2.145 -0.575 3.124 -1.174 1.307 -0.8 2.447 -1.847 3.401 -3.045C7.267 11.85 8 10.74 8 10m-8 7 11.5 0c6.627 0 12 -5.373 12 -12l0 -5" stroke-width="1"></path>
                            </svg>
                            Back to Register
                        </a>
                    </p>
                </form>
            </section>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
</body>

</html>
