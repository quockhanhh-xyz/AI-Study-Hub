<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP - AI Study Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />

<style>
.theme-toggle-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border-radius: 50%;
  transition: background 0.2s, color 0.2s;
  margin-right: 16px;
}
.theme-toggle-btn:hover {
  background: var(--border);
  color: var(--primary);
}
.theme-toggle-btn .icon-sun {
  display: none;
}
[data-theme="dark"] .theme-toggle-btn .icon-moon {
  display: none;
}
[data-theme="dark"] .theme-toggle-btn .icon-sun {
  display: block;
}
</style>
</head>

<body>
    <div class="auth-shell">
        <div class="auth-visual">
            <div class="auth-visual-overlay"></div>
            
            <div class="auth-illustration">
                <div class="ill-orbit"></div>
                <div class="ill-center" title="AI Study Hub">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z" />
                    </svg>
                </div>
                
                <div class="ill-orbit-ring">
                    <div class="ill-icon ill-doc" title="Document Preview">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                        </svg>
                        <span class="ill-label">Docs</span>
                    </div>
                    
                    <div class="ill-icon ill-ai" title="AI Q&A">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                        </svg>
                        <span class="ill-label">Q&A</span>
                    </div>
                    
                    <div class="ill-icon ill-flashcard" title="Flashcard/Quiz">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                        </svg>
                        <span class="ill-label">Quiz</span>
                    </div>
                    
                    <div class="ill-icon ill-community" title="Community Library">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        <span class="ill-label">Groups</span>
                    </div>
                </div>
            </div>
            
            <div class="auth-visual-content">
                <h2 class="auth-visual-title">AI Study Hub<br><span class="auth-visual-tagline">Study smarter from every document.</span></h2>
                <p class="auth-visual-subtitle">Upload materials, ask AI questions, generate quizzes, and review with flashcards.</p>
            </div>
        </div>

        <main class="auth-container">
            <section class="card form-card">
                <div style="text-align: center; margin-bottom: 32px;">
                    <h2 style="font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; margin-top: 0;">Verify Your Email</h2>
                    <p style="color: var(--text-muted); font-size: 15px; margin: 0;">We sent a 6-digit code to <strong id="displayEmail" style="color: var(--text-main); font-weight: 600;"></strong></p>
                </div>
                
                <p id="otpMessage" class="helper-text"></p>
                
                <form id="otpForm" novalidate>
                    <div class="form-group" style="display: flex; flex-direction: column; align-items: center; margin-bottom: 32px; margin-top: 24px;">
                        <div style="width: max-content;">
                            <label style="display: block; text-align: left; width: 100%;">Enter OTP Code</label>
                            <div class="otp-container" style="display: flex; gap: 10px; margin-top: 12px; margin-bottom: 0;">
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required autocomplete="one-time-code" autofocus />
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
                            </div>
                        </div>
                        <input type="hidden" id="otp" name="otp" />
                    </div>
                    
                    <button type="submit" class="btn btn-primary" id="verifyBtn">Verify</button>
                    <button type="button" class="btn btn-secondary" id="resendBtn" style="margin-top: 12px;">Resend OTP</button>
                    
                    <div style="text-align: center; margin-top: 24px;">
                        <a href="register.html" style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 13px; transition: color 0.2s;">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" id="Right-Angle-Arrow--Streamline-Guidance-Free" height="14" width="14" aria-hidden="true" focusable="false">
                              <path stroke="currentColor" d="M8 24c0 -0.741 -0.733 -1.85 -1.475 -2.78 -0.954 -1.2 -2.094 -2.247 -3.401 -3.046C2.144 17.575 0.956 17 0 17m0 0c0.956 0 2.145 -0.575 3.124 -1.174 1.307 -0.8 2.447 -1.847 3.401 -3.045C7.267 11.85 8 10.74 8 10m-8 7 11.5 0c6.627 0 12 -5.373 12 -12l0 -5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                            Back to Register
                        </a>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
<script src="js/notification-api.js"></script>
    <script src="js/notification.js"></script>
</body>

</html>
