<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify OTP - AI Study Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />

</head>

<body>
    <div class="auth-shell">
        <div class="auth-visual">
            <div class="auth-bubble auth-bubble-1"></div>
            <div class="auth-bubble auth-bubble-2"></div>
            <div class="auth-bubble auth-bubble-3"></div>
            <div class="auth-bubble auth-bubble-4"></div>
            
            <div class="auth-visual-content">
                <h2 class="auth-visual-title">AI Study Hub</h2>
                <p class="auth-visual-subtitle">Secure your account and continue your learning journey.</p>
            </div>
        </div>

        <main class="auth-container">
            <section class="card form-card">
                <div style="text-align: center; margin-bottom: 32px;">
                    <h2 style="font-size: 32px; font-weight: 800; color: #172033; margin-bottom: 8px; margin-top: 0;">Verify Your Email</h2>
                    <p style="color: var(--text-muted); font-size: 15px; margin: 0;">OTP has been sent to <strong id="displayEmail" style="color: var(--primary);"></strong></p>
                </div>
                
                <p id="otpMessage" class="helper-text"></p>
                
                <form id="otpForm" novalidate>
                    <div class="form-group" style="display: flex; flex-direction: column; align-items: center; margin-bottom: 32px; margin-top: 24px;">
                        <div style="width: max-content;">
                            <label style="display: block; text-align: left; width: 100%;">Enter OTP Code</label>
                            <div class="otp-container" style="display: flex; gap: 10px; margin-top: 12px; margin-bottom: 0;">
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required autocomplete="one-time-code" autofocus />
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
                                <input type="text" class="otp-input" maxlength="1" inputmode="numeric" pattern="[0-9]*" required />
                            </div>
                        </div>
                        <input type="hidden" id="otp" name="otp" />
                    </div>
                    
                    <button type="submit" class="btn btn-primary" id="verifyBtn">Verify</button>
                    <button type="button" class="btn btn-secondary" id="resendBtn" style="margin-top: 12px;">Resend OTP</button>
                    
                    <div style="text-align: center; margin-top: 24px;">
                        <a href="register.html" style="display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); text-decoration: none; font-size: 13px; transition: color 0.2s;">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" id="Right-Angle-Arrow--Streamline-Guidance-Free" height="14" width="14" aria-hidden="true" focusable="false">
                              <path stroke="currentColor" d="M8 24c0 -0.741 -0.733 -1.85 -1.475 -2.78 -0.954 -1.2 -2.094 -2.247 -3.401 -3.046C2.144 17.575 0.956 17 0 17m0 0c0.956 0 2.145 -0.575 3.124 -1.174 1.307 -0.8 2.447 -1.847 3.401 -3.045C7.267 11.85 8 10.74 8 10m-8 7 11.5 0c6.627 0 12 -5.373 12 -12l0 -5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                            Back to Register
                        </a>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
</body>

</html>
