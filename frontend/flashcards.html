<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards - AI Study Hub</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h2 class="logo">AI Study Hub</h2>
      <nav class="sidebar-nav"></nav>
    </aside>

    <main class="main-content">
      <section class="page-header" style="display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px;">
        <div>
          <h1 id="flashcardSetTitle" style="font-size: 22px; font-weight: 800; color: var(--text);">Flashcards</h1>
          <p class="dashboard-subtitle" id="flashcardSetMeta" style="font-size: 13px; color: var(--muted); margin-top: 4px;"></p>
        </div>
        <a href="#" class="btn btn-outline" id="flashcardBackLink" style="font-size: 13px; font-weight: 500; white-space: nowrap; padding: 6px 14px; border-radius: 8px;">← Back to document</a>
      </section>

      <div id="flashcardLoader" class="empty-state dashboard-loader">
        <span>Loading flashcards...</span>
      </div>

      <div id="flashcardErrorState" class="status-box status-error" style="display:none;"></div>

      <section id="flashcardViewer" class="card flashcard-viewer" style="display:none; padding: 24px;">
        <div class="flashcard-progress-row" style="margin-bottom: 16px;">
          <div class="flashcard-progress" id="flashcardProgress" style="font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px;"></div>
          <div class="flashcard-progress-track" style="height: 6px; background: var(--border); border-radius: 4px; overflow: hidden;">
            <div class="flashcard-progress-fill" id="flashcardProgressFill" style="height: 100%; background: var(--primary); transition: width 0.3s ease;"></div>
          </div>
        </div>

        <div class="flashcard-stage" id="flashcardStage" role="button" tabindex="0"
          aria-label="Flashcard, click or press Enter/Space to flip" style="cursor: pointer; perspective: 1000px; min-height: 240px; margin-bottom: 20px;">
          <div class="flashcard-card" id="flashcardCard" style="position: relative; width: 100%; min-height: 240px; text-align: center; transition: transform 0.4s; transform-style: preserve-3d; border-radius: 12px; border: 1px solid var(--border); background: var(--surface);">
            <div class="flashcard-face flashcard-face-front" style="padding: 24px; display: flex; flex-direction: column; justify-content: space-between; min-height: 240px;">
              <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <span class="flashcard-face-label" style="font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--muted); text-transform: uppercase;">FRONT</span>
                <span style="font-size: 12px; color: var(--primary); font-weight: 500; display: inline-flex; align-items: center; gap: 4px;">
                  Click card to reveal answer 🔄
                </span>
              </div>
              <p id="flashcardFrontText" style="font-size: 18px; font-weight: 600; color: var(--text); margin: 20px 0; line-height: 1.5;"></p>
              <div style="font-size: 11px; color: var(--muted);">Click to flip</div>
            </div>
            <div class="flashcard-face flashcard-face-back" style="padding: 24px; display: flex; flex-direction: column; justify-content: space-between; min-height: 240px; background: var(--surface-soft, #f9fafb);">
              <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <span class="flashcard-face-label" style="font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--muted); text-transform: uppercase;">BACK</span>
                <span class="flashcard-source-page" id="flashcardSourcePage" style="display:none; font-size: 11px; background: var(--border); padding: 2px 8px; border-radius: 4px; color: var(--muted);"></span>
              </div>
              <p id="flashcardBackText" style="font-size: 17px; font-weight: 500; color: var(--text); margin: 20px 0; line-height: 1.5;"></p>
              <div style="font-size: 11px; color: var(--muted);">Select your recall result below</div>
            </div>
          </div>
        </div>

        <div class="flashcard-mark-row" id="flashcardMarkRow" style="display: none; justify-content: center; gap: 14px; margin: 16px 0;">
          <button type="button" class="btn btn-outline flashcard-mark-btn mark-still-learning" id="flashcardUnknownBtn"
            data-mark="unknown" style="border-color: #fde68a; color: #b45309; background: #fffbeb; font-weight: 600; font-size: 13px; padding: 10px 20px; border-radius: 8px; flex: 1; max-width: 200px; justify-content: center;">
            ✕ Still learning
          </button>
          <button type="button" class="btn btn-outline flashcard-mark-btn mark-known" id="flashcardKnownBtn"
            data-mark="known" style="border-color: #a7f3d0; color: #047857; background: #ecfdf5; font-weight: 600; font-size: 13px; padding: 10px 20px; border-radius: 8px; flex: 1; max-width: 200px; justify-content: center;">
            ✓ Known
          </button>
        </div>

        <div id="flashcardFeedbackToast" style="text-align: center; min-height: 22px; font-size: 13px; font-weight: 700; margin: 4px 0;"></div>

        <div class="flashcard-controls" style="display: flex; justify-content: space-between; align-items: center; margin-top: 16px; pt-12; border-top: 1px solid var(--border);">
          <button type="button" class="btn btn-secondary" id="flashcardPrevBtn" style="font-size: 13px; padding: 8px 16px;">← Previous</button>
          <button type="button" class="btn btn-primary" id="flashcardNextBtn" style="font-size: 13px; padding: 8px 20px; font-weight: 600;">Next →</button>
        </div>

        <div class="flashcard-controls-secondary" style="text-align: center; margin-top: 12px;">
          <button type="button" class="btn btn-text" id="flashcardRestartBtn" style="font-size: 12px; color: var(--muted); text-decoration: none;">↺ Restart session</button>
        </div>
      </section>

      <section id="flashcardSummary" class="card flashcard-summary" style="display:none; text-align: center; padding: 36px 24px; border-radius: 12px;">
        <h2 class="flashcard-summary-heading" style="font-size: 24px; font-weight: 800; color: var(--text); margin-bottom: 8px;">
          🎉 Practice session complete!
        </h2>
        <p id="flashcardSummaryText" style="color: var(--muted); font-size: 14px; margin-bottom: 28px;"></p>

        <div class="flashcard-summary-stats" style="display: flex; justify-content: center; gap: 14px; margin-bottom: 32px; flex-wrap: wrap;">
          <div class="flashcard-summary-stat total" style="padding: 16px 20px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); min-width: 110px;">
            <span class="flashcard-summary-stat-value" id="flashcardTotalCount" style="display: block; font-size: 24px; font-weight: 800; color: var(--text);">0</span>
            <span class="flashcard-summary-stat-label" style="font-size: 12px; font-weight: 600; color: var(--muted);">Reviewed</span>
          </div>
          <div class="flashcard-summary-stat known" style="padding: 16px 20px; border-radius: 10px; background: #ecfdf5; border: 1px solid #a7f3d0; min-width: 110px;">
            <span class="flashcard-summary-stat-value" id="flashcardKnownCount" style="display: block; font-size: 24px; font-weight: 800; color: #047857;">0</span>
            <span class="flashcard-summary-stat-label" style="font-size: 12px; font-weight: 600; color: #065f46;">Known</span>
          </div>
          <div class="flashcard-summary-stat unknown" style="padding: 16px 20px; border-radius: 10px; background: #fffbeb; border: 1px solid #fde68a; min-width: 110px;">
            <span class="flashcard-summary-stat-value" id="flashcardUnknownCount" style="display: block; font-size: 24px; font-weight: 800; color: #b45309;">0</span>
            <span class="flashcard-summary-stat-label" style="font-size: 12px; font-weight: 600; color: #92400e;">Still learning</span>
          </div>
          <div class="flashcard-summary-stat unmarked" style="padding: 16px 20px; border-radius: 10px; background: #f9fafb; border: 1px solid var(--border); min-width: 110px;">
            <span class="flashcard-summary-stat-value" id="flashcardUnmarkedCount" style="display: block; font-size: 24px; font-weight: 800; color: var(--muted);">0</span>
            <span class="flashcard-summary-stat-label" style="font-size: 12px; font-weight: 600; color: var(--muted);">Unmarked</span>
          </div>
        </div>

        <div class="flashcard-summary-actions" style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
          <button type="button" class="btn btn-secondary" id="flashcardReviewUnknownBtn" style="display:none; font-weight: 600;">
            Review "Still learning" cards
          </button>
          <button type="button" class="btn btn-primary" id="flashcardRestartFromSummaryBtn" style="font-weight: 600;">↺ Study again</button>
          <a href="#" class="btn btn-outline" id="flashcardSummaryBackLink" style="font-weight: 600;">← Back to document</a>
        </div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ai-learning-api.js"></script>
  <script src="js/flashcards.js"></script>
<script src="js/notification-api.js"></script>
    <script src="js/notification.js"></script>
</body>

</html>
