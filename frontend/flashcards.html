<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards - AI Study Hub</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="app-layout">
    <aside class="sidebar">
      <h2 class="logo">AI Study Hub</h2>
      <nav class="sidebar-nav"></nav>
    </aside>

    <main class="main-content">
      <section class="page-header">
        <div>
          <h1 id="flashcardSetTitle">Flashcards</h1>
          <p class="dashboard-subtitle" id="flashcardSetMeta"></p>
        </div>
      </section>

      <div id="flashcardLoader" class="empty-state dashboard-loader">
        <span>Loading flashcards...</span>
      </div>

      <div id="flashcardErrorState" class="status-box status-error" style="display:none;"></div>

      <section id="flashcardViewer" class="card flashcard-viewer" style="display:none;">
        <div class="flashcard-progress-row">
          <div class="flashcard-progress" id="flashcardProgress"></div>
          <div class="flashcard-progress-track">
            <div class="flashcard-progress-fill" id="flashcardProgressFill"></div>
          </div>
        </div>

        <div class="flashcard-stage" id="flashcardStage" role="button" tabindex="0"
          aria-label="Flashcard, click or press Enter/Space to flip">
          <div class="flashcard-card" id="flashcardCard">
            <div class="flashcard-face flashcard-face-front">
              <span class="flashcard-face-label">Front</span>
              <p id="flashcardFrontText"></p>
            </div>
            <div class="flashcard-face flashcard-face-back">
              <span class="flashcard-face-label">Back</span>
              <p id="flashcardBackText"></p>
              <span class="flashcard-source-page" id="flashcardSourcePage" style="display:none;"></span>
            </div>
          </div>
        </div>

        <div class="flashcard-mark-row" id="flashcardMarkRow">
          <button type="button" class="btn btn-outline flashcard-mark-btn" id="flashcardUnknownBtn"
            data-mark="unknown">✕ Still learning</button>
          <button type="button" class="btn btn-outline flashcard-mark-btn" id="flashcardKnownBtn" data-mark="known">✓
            Known</button>
        </div>

        <div class="flashcard-controls">
          <button type="button" class="btn btn-secondary" id="flashcardPrevBtn">← Previous</button>
          <button type="button" class="btn btn-secondary" id="flashcardNextBtn">Next →</button>
        </div>

        <div class="flashcard-controls-secondary">
          <button type="button" class="btn btn-text" id="flashcardRestartBtn">↺ Restart</button>
        </div>
      </section>

      <section id="flashcardSummary" class="card flashcard-summary" style="display:none;">
        <h2 class="flashcard-summary-heading">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14" height="20" width="20"
            aria-hidden="true">
            <g>

                clip-rule="evenodd" stroke-width="1"></path>
            </g>
          </svg>
          Set complete!
        </h2>
        <p id="flashcardSummaryText"></p>

        <div class="flashcard-summary-stats">
          <div class="flashcard-summary-stat known">
            <span class="flashcard-summary-stat-value" id="flashcardKnownCount">0</span>
            <span class="flashcard-summary-stat-label">Known</span>
          </div>
          <div class="flashcard-summary-stat unknown">
            <span class="flashcard-summary-stat-value" id="flashcardUnknownCount">0</span>
            <span class="flashcard-summary-stat-label">Still learning</span>
          </div>
        </div>

        <div class="flashcard-summary-actions">
          <button type="button" class="btn btn-secondary" id="flashcardReviewUnknownBtn" style="display:none;">
            Review "Still learning" cards
          </button>
          <button type="button" class="btn btn-primary" id="flashcardRestartFromSummaryBtn">↺ Study again</button>
        </div>
      </section>

      <a href="#" class="back-link" id="flashcardBackLink">← Back to document</a>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ai-learning-api.js"></script>
  <script src="js/flashcards.js"></script>
</body>

</html>
