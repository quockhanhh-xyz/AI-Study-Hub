<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Library - AI Study Hub</title>
    <meta name="description" content="Manage all your personal documents and folders in your library." />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* ===== MY LIBRARY TABS ===== */
      .library-tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 24px;
        padding-bottom: 0;
      }
      .library-tab {
        padding: 12px 16px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: all 0.2s;
        margin-bottom: -1px;
      }
      .library-tab:hover {
        color: var(--text-main);
      }
      .library-tab.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
      }
      
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }

      /* ===== COMPACT FOLDER CARD SYSTEM ===== */
      .folder-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
        margin-top: 12px;
      }
      .folder-card {
        position: relative;
        background: #ffffff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        height: 110px !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        box-sizing: border-box;
      }
      .folder-card:hover {
        border-color: var(--primary);
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
      }
      .folder-card-main {
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        gap: 12px !important;
        width: calc(100% - 24px) !important;
        text-align: left !important;
      }
      .folder-icon {
        color: var(--primary) !important;
        flex-shrink: 0;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      .folder-icon svg {
        width: 32px !important;
        height: 32px !important;
      }
      .folder-info-text {
        display: flex !important;
        flex-direction: column !important;
        gap: 4px !important;
        align-items: flex-start !important;
        text-align: left !important;
        min-width: 0 !important;
      }
      .folder-name {
        margin: 0 !important;
        font-size: 15px !important;
        font-weight: 700 !important;
        color: var(--text-main) !important;
        overflow: hidden !important;
        text-overflow: ellipsis !important;
        white-space: nowrap !important;
        text-align: left !important;
        width: 100% !important;
      }
      .folder-meta {
        margin: 0 !important;
        font-size: 12px !important;
        color: var(--muted) !important;
        text-align: left !important;
      }
      .folder-card-actions {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 5;
      }
      .btn-kebab {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        padding: 4px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s, color 0.2s;
      }
      .btn-kebab:hover {
        background-color: var(--bg-hover);
        color: var(--text-main);
      }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <h2 class="logo">AI Study Hub</h2>
            <nav class="sidebar-nav"></nav>
        </aside>

        <main class="main-content">
            <section class="page-header dashboard-header">
                <div class="dashboard-header-content">
                    <div>
                        <h1>My Library</h1>
                        <p class="dashboard-subtitle" id="breadcrumbPath">Your personal workspace.</p>
                    </div>
                    <div style="display: flex; gap: 12px;">
                        <button type="button" id="createFolderBtn" class="btn btn-secondary" style="display: none; align-items: center; gap: 6px;">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" height="16" width="16" aria-hidden="true">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                            New Folder
                        </button>
                        <button type="button" id="uploadDocumentBtn" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 6px;">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" height="16" width="16" aria-hidden="true">
                                <path fill="currentColor" d="M6 18h12v-3h2v5H4v-5h2zm11.207 -8.707L15.793 10.707 13 7.914V16h-2V7.914L8.207 10.707 6.793 9.293 12 4.086z"></path>
                            </svg>
                            Upload Document
                        </button>
                    </div>
                </div>
            </section>
            
            <section class="card dashboard-panel">
                <div class="library-tabs">
                    <div class="library-tab active" data-tab="documents">Documents</div>
                    <div class="library-tab" data-tab="folders">Folders</div>
                    <div class="library-tab" data-tab="favorites" style="display: flex; align-items: center;">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" height="16" width="16" aria-hidden="true" style="margin-right: 4px;">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
                        </svg>
                        Favorites
                    </div>
                </div>
                
                <div class="dashboard-search" style="max-width: 480px; margin-bottom: 20px;">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" height="24" width="24" class="search-icon">
                        <path fill="currentColor" d="M11 2c4.9706 0 9 4.0294 9 9 0 2.125-0.7381 4.0766-1.9697 5.6162l4.1767 4.1768-1.414 1.414-4.1768-4.1767C15.0766 19.2619 13.125 20 11 20c-4.9706 0-9-4.0294-9-9 0-4.9706 4.0294-9 9-9m0 2c-3.866 0-7 3.134-7 7 0 3.866 3.134 7 7 7 3.866 0 7-3.134 7-7 0-3.866-3.134-7-7-7" />
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search your library..." style="padding-left: 40px; width: 100%;" />
                </div>
                
                <div id="documentsTab" class="tab-content active">
                      <div class="toolbar" style="margin-bottom: 20px; display: flex; gap: 16px; align-items: center; flex-wrap: nowrap; width: 100%;">
                          <div class="filter-group" style="flex: 1; min-width: 0;">
                              <input type="text" id="subjectFilter" list="subjectDatalist" placeholder="Filter by Subject..." style="width: 100%; min-width: unset; max-width: none;" />
                              <datalist id="subjectDatalist"></datalist>
                          </div>
                          <div class="filter-group" style="flex: 1; min-width: 0;">
                              <select id="fileTypeFilter" style="width: 100%; min-width: unset; max-width: none;">
                                  <option value="">All File Types</option>
                                  <option value="PDF">PDF</option>
                                  <option value="DOC">Word</option>
                                  <option value="XLS">Excel</option>
                                  <option value="PPT">PowerPoint</option>
                                  <option value="IMAGE">Image</option>
                              </select>
                          </div>
                          <div class="filter-group" style="flex: 1; min-width: 0;">
                              <select id="folderFilter" style="width: 100%; min-width: unset; max-width: none;">
                                  <option value="">All Folders</option>
                                  <option value="0">Root (My Library)</option>
                              </select>
                          </div>
                          <button type="button" id="clearFiltersBtn" style="flex: 1; min-width: 0; padding: 11px 16px; border: 1.5px solid var(--border); border-radius: 12px; background-color: #ffffff; color: var(--text-main); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 2px 8px rgba(23, 32, 51, 0.02); height: 45.5px;">Clear Filters</button>
                      </div>

                    <div id="documentGrid" class="document-grid">
                        <div style="text-align: center; padding: 40px; color: var(--muted); width: 100%;">
                            <p>Loading documents...</p>
                        </div>
                    </div>
                    <div id="documentEmptyState" class="empty-state" style="display: none;">
                        <div class="empty-state-icon">📄</div>
                        <h3>No Documents Found</h3>
                        <p>You haven't uploaded any documents matching this criteria yet.</p>
                        <button type="button" class="btn btn-primary" style="margin-top: 16px;" onclick="document.getElementById('uploadDocumentBtn').click()">Upload Your First Document</button>
                    </div>
                </div>
                
                <div id="foldersTab" class="tab-content">
                    <div id="folderBreadcrumb" style="margin-bottom: 20px; font-weight: 500; display: flex; align-items: center; gap: 8px;">
                        <a href="#" class="breadcrumb-link" data-id="null">My Library</a>
                    </div>
                    <div id="folderGrid" class="folder-grid">
                        <div style="text-align: center; padding: 40px; color: var(--muted); width: 100%;">
                            <p>Loading folders...</p>
                        </div>
                    </div>
                    <div id="folderEmptyState" class="empty-state" style="display: none;">
                        <div class="empty-state-icon">📁</div>
                        <h3>No Folders Here</h3>
                        <p>Create a folder to organize your study materials.</p>
                        <button type="button" class="btn btn-primary" style="margin-top: 16px;" onclick="document.getElementById('createFolderBtn').click()">Create Folder</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/account-api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/folder-api.js"></script>
    <script src="js/document-api.js"></script>
    <script src="js/my-library.js"></script>
</body>
</html>
