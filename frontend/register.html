<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - AI Study Hub</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="auth-shell">
        <main style="width: 100%; max-width: 440px;">
            <div class="page-header" style="text-align: center; margin-bottom: 24px;">
                <h1 style="font-size: 24px; margin: 0 0 6px;">AI Study Hub</h1>
                <p>Sign up to start learning with AI Study Hub.</p>
            </div>
            <section class="card form-card" style="max-width: 100%;">
                <h2 style="margin: 0 0 20px; font-size: 18px;">Create Account</h2>
                <p id="registerMessage" class="helper-text"></p>
                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="Nguyen Van A" required autocomplete="name" />
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="user@test.com" required autocomplete="email" />
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="At least 8 characters, letters and numbers"
                            required autocomplete="new-password" minlength="8" />
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter password" required
                            autocomplete="new-password" />
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                    <p class="helper-text">
                        Already have an account? <a href="login.html">Login</a>
                    </p>
                </form>
            </section>
        </main>
    </div>

    <!-- Keep only the necessary JS files. -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
