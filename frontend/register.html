<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - AI Study Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />

</head>

<body>
    <div class="auth-shell">
        <div class="auth-visual">
            <div class="auth-bubble auth-bubble-1"></div>
            <div class="auth-bubble auth-bubble-2"></div>
            <div class="auth-bubble auth-bubble-3"></div>
            <div class="auth-bubble auth-bubble-4"></div>
            
            <div class="auth-visual-content">
                <h2 class="auth-visual-title">AI Study Hub</h2>
                <p class="auth-visual-subtitle">Join us and empower your learning journey with the ultimate AI assistant.</p>
            </div>
        </div>

        <main class="auth-container">
            <section class="card form-card">
                <div style="text-align: center; margin-bottom: 32px;">
                    <h2 style="font-size: 32px; font-weight: 800; color: #172033; margin-bottom: 8px; margin-top: 0;">Create Account</h2>
                    <p style="color: var(--text-muted); font-size: 15px; margin: 0;">Sign up to start learning with AI Study Hub.</p>
                </div>
                
                <p id="registerMessage" class="helper-text"></p>
                
                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="Nguyen Van A" required autocomplete="name" />
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required autocomplete="email" />
                    </div>
                    <div class="form-group password-group">
                        <label for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" placeholder="At least 8 characters, letters and numbers" required autocomplete="new-password" minlength="8" />
                            <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility" title="Show/Hide Password">👁️</button>
                        </div>
                    </div>
                    <div class="form-group password-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirmPassword" placeholder="Re-enter password" required autocomplete="new-password" />
                            <button type="button" class="btn-toggle-password" aria-label="Toggle password visibility" title="Show/Hide Password">👁️</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="margin-top: 8px;">Create Account</button>
                    <p class="helper-text">
                        Already have an account? <a href="login.html">Sign in</a>
                    </p>
                </form>
            </section>
        </main>
    </div>

    <!-- Keep only the necessary JS files. -->
    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
</body>

</html>
