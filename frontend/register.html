<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - AI Study Hub</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />

</head>

<body>
    <div class="auth-shell">
        <main class="auth-container">
            <div class="auth-header">
                <h1 class="auth-title">AI Study Hub</h1>
                <p>Sign up to start learning with AI Study Hub.</p>
            </div>
            <section class="card form-card">
                <h2 class="auth-card-title">Create Account</h2>
                <p id="registerMessage" class="helper-text"></p>
                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="Nguyen Van A" required autocomplete="name" />
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="user@test.com" required autocomplete="email" />
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-field">
                            <input type="password" id="password" placeholder="Enter your password" required
                                autocomplete="new-password" minlength="8" />
                            <button type="button" class="password-toggle-btn" data-target="password"
                                aria-label="Show password">
                                <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    height="18" width="18" aria-hidden="true" focusable="false">
                                    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M2.25 12S6 4.5 12 4.5s9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12Z">
                                    </path>
                                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"></circle>
                                </svg>
                                <svg class="icon-eye-off" style="display: none;" xmlns="http://www.w3.org/2000/svg"
                                    fill="none" viewBox="0 0 24 24" height="18" width="18" aria-hidden="true"
                                    focusable="false">
                                    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.5 6.7C4.2 8.2 2.25 12 2.25 12S6 19.5 12 19.5c1.85 0 3.47-.42 4.86-1.06M9.9 4.7A10.6 10.6 0 0 1 12 4.5c6 0 9.75 7.5 9.75 7.5a17.6 17.6 0 0 1-2.44 3.42">
                                    </path>
                                </svg>
                            </button>
                        </div>
                        <small class="field-hint">At least 8 characters, including letters and numbers.</small>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-field">
                            <input type="password" id="confirmPassword" placeholder="Re-enter password" required
                                autocomplete="new-password" />
                            <button type="button" class="password-toggle-btn" data-target="confirmPassword"
                                aria-label="Show password">
                                <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                    height="18" width="18" aria-hidden="true" focusable="false">
                                    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M2.25 12S6 4.5 12 4.5s9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12Z">
                                    </path>
                                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"></circle>
                                </svg>
                                <svg class="icon-eye-off" style="display: none;" xmlns="http://www.w3.org/2000/svg"
                                    fill="none" viewBox="0 0 24 24" height="18" width="18" aria-hidden="true"
                                    focusable="false">
                                    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.5 6.7C4.2 8.2 2.25 12 2.25 12S6 19.5 12 19.5c1.85 0 3.47-.42 4.86-1.06M9.9 4.7A10.6 10.6 0 0 1 12 4.5c6 0 9.75 7.5 9.75 7.5a17.6 17.6 0 0 1-2.44 3.42">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                    <p class="helper-text">
                        Already have an account? <a href="login.html">Login</a>
                    </p>
                </form>
            </section>
        </main>
    </div>

    <!-- Keep only the necessary JS files. -->
    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/layout.js"></script>
</body>

</html>
